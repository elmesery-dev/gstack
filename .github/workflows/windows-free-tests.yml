name: Windows Free Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-bash-environment-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Isolate Windows environment requirements under Git Bash
        shell: bash
        env:
          PROBE_SHELL: bash-groups
        run: bun scripts/windows-identity-diagnostic.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-bash-environment-diagnostic
          path: windows-identity-*.json
