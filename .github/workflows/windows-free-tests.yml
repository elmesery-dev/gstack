name: Windows Free Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-argv-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Isolate UNC path transport
        shell: bash
        run: bun scripts/windows-argv-diagnostic.ts > windows-argv-diagnostic.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-argv-diagnostic
          path: windows-argv-diagnostic.json
