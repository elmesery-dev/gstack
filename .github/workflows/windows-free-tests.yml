name: Windows Free Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold-native-board-query:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        query: [current, wmi]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Build import prerequisite
        shell: bash
        run: bash browse/scripts/build-node-server.sh
      - name: Select diagnostic command
        env:
          QUERY_VARIANT: ${{ matrix.query }}
        run: bun scripts/windows-query-instrument.ts
      - name: Cold real board callback
        shell: bash
        run: |
          set -o pipefail
          bun test test/plan-review-board-feedback.test.ts --test-name-pattern '^the declared board protocol' 2>&1 | tee windows-cold-board.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-cold-board-${{ matrix.query }}
          path: windows-cold-board.log
