name: Windows Free Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cache-and-quoting-proof:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Prove native Bash quoting candidate
        shell: bash
        run: bun scripts/windows-argv-split-diagnostic.ts > windows-argv-split.json
      - name: Verify query cache environment
        shell: bash
        env:
          PROBE_SHELL: cache
        run: bun scripts/windows-identity-diagnostic.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-cache-and-quoting-proof
          path: |
            windows-identity-*.json
            windows-argv-split.json
