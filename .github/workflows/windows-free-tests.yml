name: Windows Free Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold-native-board-query:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        query: [pwsh]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Build import prerequisite
        shell: bash
        run: bash browse/scripts/build-node-server.sh
      - name: Cold real board callback
        shell: bash
        run: |
          set -o pipefail
          bun test test/plan-review-board-feedback.test.ts 2>&1 | tee windows-cold-board.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-cold-board-${{ matrix.query }}
          path: |
            windows-cold-board.log
            windows-query-phase.log
