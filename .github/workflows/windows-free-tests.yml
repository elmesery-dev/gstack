name: Windows Free Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-identity-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Diagnose native identity query without changing actor budgets
        run: bun scripts/windows-identity-diagnostic.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-identity-diagnostic
          path: windows-identity-diagnostic.json
